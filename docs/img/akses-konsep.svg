<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <rect width="900" height="360" fill="#ffffff"/>

  <!-- the table in the database -->
  <text x="20" y="28" font-size="15" font-weight="600" fill="#202124">1. Tabel sheet_access di database (satu baris = satu aturan)</text>
  <g transform="translate(20,40)">
    <rect width="520" height="150" rx="6" fill="#f8f9fa" stroke="#dadce0"/>
    <g font-weight="600" fill="#5f6368">
      <text x="12" y="24">who</text><text x="130" y="24">effect</text><text x="210" y="24">action</text><text x="300" y="24">where</text>
    </g>
    <line x1="0" y1="34" x2="520" y2="34" stroke="#dadce0"/>
    <g fill="#202124">
      <text x="12" y="58">role:kasir</text><text x="130" y="58" fill="#188038">allow</text><text x="210" y="58">read</text><text x="300" y="58">Produk!A1:I13</text>
      <text x="12" y="84">role:kasir</text><text x="130" y="84" fill="#188038">allow</text><text x="210" y="84">edit</text><text x="300" y="84">Produk!col:Stok</text>
      <text x="12" y="110">role:kasir</text><text x="130" y="110" fill="#d93025">deny</text><text x="210" y="110">read</text><text x="300" y="110">Produk!col:Harga beli</text>
      <text x="12" y="136">user:budi</text><text x="130" y="136" fill="#188038">allow</text><text x="210" y="136">edit</text><text x="300" y="136">Produk!col:Harga beli</text>
    </g>
  </g>

  <!-- the person -->
  <text x="580" y="28" font-size="15" font-weight="600" fill="#202124">2. Siapa yang membuka</text>
  <g transform="translate(580,40)">
    <rect width="300" height="64" rx="6" fill="#e8f0fe" stroke="#aecbfa"/>
    <text x="14" y="26" fill="#202124">{ user: 'rina',</text>
    <text x="14" y="48" fill="#202124">  roles: ['kasir'] }</text>
  </g>
  <text x="580" y="136" fill="#5f6368">dari sesi login aplikasimu</text>

  <!-- arrow -->
  <path d="M280 200 L280 232 M540 120 L560 120" stroke="#5f6368" stroke-width="2" fill="none"/>
  <path d="M272 224 L280 236 L288 224" fill="#5f6368"/>

  <!-- the rules of deciding -->
  <text x="20" y="262" font-size="15" font-weight="600" fill="#202124">3. Untuk setiap sel dan setiap aksi, diputuskan dengan 3 aturan:</text>
  <g transform="translate(20,276)">
    <rect width="270" height="68" rx="6" fill="#fef7e0" stroke="#fdd663"/>
    <text x="12" y="26" font-weight="600">Yang spesifik menang</text>
    <text x="12" y="50" fill="#3c4043">user:  &gt;  role:  &gt;  *</text>
  </g>
  <g transform="translate(305,276)">
    <rect width="270" height="68" rx="6" fill="#fce8e6" stroke="#f6aea9"/>
    <text x="12" y="26" font-weight="600">Di tingkat yang sama</text>
    <text x="12" y="50" fill="#3c4043">deny menang atas allow</text>
  </g>
  <g transform="translate(590,276)">
    <rect width="290" height="68" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="12" y="26" font-weight="600">Tidak disebut</text>
    <text x="12" y="50" fill="#3c4043">tidak didapat (kecuali bagian layar)</text>
  </g>
</svg>
