<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, system-ui, sans-serif" font-size="14">
  <rect width="760" height="230" fill="#ffffff"/>
  <text x="20" y="28" font-weight="600" fill="#202124">Kalau beberapa aturan mengenai sel yang sama, yang paling spesifik menang</text>
  <!-- three steps, the most specific on top -->
  <g transform="translate(20,46)">
    <rect x="0" y="0" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#aecbfa"/>
    <text x="14" y="20" font-weight="600">1. user:budi</text>
    <text x="14" y="38" font-size="12" fill="#5f6368">aturan untuk satu akun</text>
    <rect x="0" y="58" width="300" height="46" rx="6" fill="#f1f3f4" stroke="#dadce0"/>
    <text x="14" y="78" font-weight="600">2. role:kasir</text>
    <text x="14" y="96" font-size="12" fill="#5f6368">aturan untuk satu role</text>
    <rect x="0" y="116" width="300" height="46" rx="6" fill="#f8f9fa" stroke="#e8eaed"/>
    <text x="14" y="136" font-weight="600">3. *</text>
    <text x="14" y="154" font-size="12" fill="#5f6368">aturan untuk semua orang</text>
  </g>
  <path d="M340 60 L340 196" stroke="#5f6368" stroke-width="2"/>
  <path d="M333 70 L340 56 L347 70" fill="#5f6368"/>
  <text x="352" y="72" font-size="12" fill="#5f6368">menang</text>
  <!-- the example -->
  <g transform="translate(420,46)">
    <text x="0" y="14" font-size="12" fill="#5f6368">Contoh: sel Harga beli, dibuka oleh budi (role kasir)</text>
    <rect x="0" y="26" width="320" height="28" rx="4" fill="#e6f4ea" stroke="#a8dab5"/>
    <text x="10" y="45" font-family="Consolas, monospace" font-size="13">user:budi  allow edit</text>
    <text x="240" y="45" font-size="12" fill="#188038" font-weight="600">dipakai</text>
    <rect x="0" y="62" width="320" height="28" rx="4" fill="#f8f9fa" stroke="#e8eaed"/>
    <text x="10" y="81" font-family="Consolas, monospace" font-size="13" fill="#9aa0a6">role:kasir deny read</text>
    <text x="240" y="81" font-size="12" fill="#9aa0a6">kalah</text>
    <text x="0" y="118" font-size="12" fill="#3c4043">Hasil: budi boleh mengubah Harga beli,</text>
    <text x="0" y="136" font-size="12" fill="#3c4043">kasir lain tidak bisa melihatnya.</text>
    <text x="0" y="164" font-size="12" fill="#5f6368">Di tingkat yang sama: deny menang atas allow.</text>
  </g>
</svg>
