<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/></marker>
  </defs>
  <rect width="860" height="360" fill="#ffffff"/>

  <!-- the workbook in the middle -->
  <rect x="330" y="90" width="200" height="150" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="430" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#1a73e8">WORKBOOK</text>
  <text x="430" y="146" text-anchor="middle" font-size="13" fill="#202124">isi data:</text>
  <text x="430" y="168" text-anchor="middle" font-size="13" fill="#202124">nilai, rumus, format</text>
  <text x="430" y="190" text-anchor="middle" font-size="13" fill="#202124">undo</text>
  <text x="430" y="222" text-anchor="middle" font-size="12" fill="#5f6368">createWorkbook()</text>

  <!-- the sheet on the left -->
  <rect x="30" y="100" width="200" height="130" rx="10" fill="#f8f9fa" stroke="#5f6368" stroke-width="1.5"/>
  <text x="130" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">&lt;Sheet&gt;</text>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#5f6368">yang dilihat orang</text>
  <g font-size="11" fill="#202124">
    <rect x="55" y="162" width="150" height="54" fill="#fff" stroke="#dadce0"/>
    <line x1="55" y1="180" x2="205" y2="180" stroke="#dadce0"/><line x1="55" y1="198" x2="205" y2="198" stroke="#dadce0"/>
    <line x1="115" y1="162" x2="115" y2="216" stroke="#dadce0"/><line x1="160" y1="162" x2="160" y2="216" stroke="#dadce0"/>
    <text x="60" y="175">Produk</text><text x="120" y="175">Harga</text><text x="165" y="175">Qty</text>
    <text x="60" y="193">Semen</text><text x="120" y="193">72000</text><text x="165" y="193">10</text>
    <text x="60" y="211">Besi</text><text x="120" y="211">79500</text><text x="165" y="211">5</text>
  </g>
  <line x1="326" y1="140" x2="236" y2="140" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
  <text x="281" y="132" text-anchor="middle" font-size="12" fill="#5f6368">tampil</text>
  <line x1="236" y1="195" x2="326" y2="195" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
  <text x="281" y="214" text-anchor="middle" font-size="12" fill="#5f6368">diketik</text>

  <!-- the rest of the page on the right -->
  <g font-size="13" fill="#202124">
    <rect x="630" y="40" width="200" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="730" y="64" text-anchor="middle" font-weight="700">Total: Rp 1.117.500</text>
    <text x="730" y="84" text-anchor="middle" font-size="12" fill="#5f6368">useWorkbook (membaca)</text>
    <rect x="630" y="140" width="200" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="730" y="164" text-anchor="middle" font-weight="700">[ +1 semen ]</text>
    <text x="730" y="184" text-anchor="middle" font-size="12" fill="#5f6368">wb.setValues (mengubah)</text>
    <rect x="630" y="240" width="200" height="56" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="730" y="264" text-anchor="middle" font-weight="700">[ Simpan ]</text>
    <text x="730" y="284" text-anchor="middle" font-size="12" fill="#5f6368">wb.toJSON() ke server</text>
  </g>
  <line x1="534" y1="120" x2="626" y2="74" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
  <line x1="626" y1="168" x2="534" y2="168" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>
  <line x1="534" y1="215" x2="626" y2="262" stroke="#5f6368" stroke-width="2" marker-end="url(#a)"/>

  <text x="430" y="300" text-anchor="middle" font-size="14" fill="#202124">Semua membaca dan mengubah <tspan font-weight="700">workbook yang sama</tspan>.</text>
  <text x="430" y="324" text-anchor="middle" font-size="14" fill="#202124">Ubah workbook, semua yang membacanya ikut berubah.</text>
</svg>
